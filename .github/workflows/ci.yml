name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - name: Verify dist/index.js exists and is valid
        run: |
          test -f dist/index.js && echo "✅ dist/index.js exists"
          node --check dist/index.js && echo "✅ Action module valid"
